name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and portfolio behavior
        run: |
          node --check script.js
          node --check hero-motion.js
          node --check editorial.js
          node scripts/check.mjs
          node scripts/check-supports.mjs
          node --check dossier-decisions/interface.js
          node scripts/check-decisions.mjs
          node scripts/check-atelier.mjs
          node --check atelier-editorial/atelier.js
          node --check atelier-editorial/experience.js
