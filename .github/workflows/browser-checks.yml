name: Portfolio browser checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-screenshots
          path: screenshots/
          if-no-files-found: ignore
